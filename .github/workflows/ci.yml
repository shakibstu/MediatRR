name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore MediatRR.sln

      - name: Build
        run: dotnet build MediatRR.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test MediatRR.sln --configuration Release --no-build --verbosity normal
